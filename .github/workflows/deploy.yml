# Builds the Astro site and publishes it to GitHub Pages on every push to main, and whenever content is
# published in Sanity (a Sanity webhook sends a `sanity-content` repository_dispatch event — see README).
# https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-content]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Public project settings (content is read at build time; no token needed for a public dataset)
env:
  PUBLIC_SANITY_PROJECT_ID: hnwfsxph
  PUBLIC_SANITY_DATASET: production

jobs:
  # Safety check: stops the deploy if the code has a type error (the same check as `npm run check`)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
